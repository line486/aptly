name: Check aptly New Version

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get latest aptly release
        id: latest
        run: |
          LATEST_TAG=$(curl -sfL "https://api.github.com/repos/aptly-dev/aptly/releases/latest" | jq -r '.tag_name')
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "Failed to fetch latest release"
            exit 1
          fi
          LATEST_VERSION="${LATEST_TAG#v}"
          echo "version=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "Latest aptly version: $LATEST_VERSION"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check if version already built
        id: check
        run: |
          if docker manifest inspect "${{ secrets.DOCKERHUB_USERNAME }}/aptly:${{ steps.latest.outputs.version }}" > /dev/null 2>&1; then
            echo "new_release=false" >> "$GITHUB_OUTPUT"
            echo "Version ${{ steps.latest.outputs.version }} already exists on Docker Hub"
          else
            echo "new_release=true" >> "$GITHUB_OUTPUT"
            echo "New version to build: ${{ steps.latest.outputs.version }}"
          fi

      - name: Checkout
        if: steps.check.outputs.new_release == 'true'
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: steps.check.outputs.new_release == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.check.outputs.new_release == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.check.outputs.new_release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APTLY_VERSION=${{ steps.latest.outputs.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/aptly:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/aptly:${{ steps.latest.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max